name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: composer validate --strict --no-check-publish
      - run: composer audit --locked --no-interaction
      - name: PHP syntax
        run: find app database public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/passkeys_test.php
